<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Alejandro Agredo bold black-to-gray favicon">
  <title>Alejandro Agredo bold black-to-gray favicon</title>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#454545"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0B"/>
      <stop offset="1" stop-color="#767676"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="42" fill="#F2F2F2"/>
  <!-- Slightly heavier facets keep the existing A recognizable at 16px. -->
  <g stroke-width="8" stroke-linejoin="round">
